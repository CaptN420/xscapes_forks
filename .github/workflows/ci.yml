name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -timeout 20m ./...

  cross-build:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [darwin/arm64, darwin/amd64, linux/amd64, linux/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: "0"
        run: |
          os=${{ matrix.target }}; os=${os%/*}
          arch=${{ matrix.target }}; arch=${arch#*/}
          GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null .
          GOOS=$os GOARCH=$arch go vet ./...

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh and release.sh parse and lint
        run: |
          sh -n site/install.sh
          sh -n site/release.sh
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -s sh -S warning site/install.sh
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("site/install.ps1", [ref]$null, [ref]$e) | Out-Null
          if ($e) { $e; exit 1 }
